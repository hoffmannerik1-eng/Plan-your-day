<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RoutineOS</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
    background:
        radial-gradient(circle at 20% 10%,#19315c 0%,transparent 35%),
        radial-gradient(circle at 90% 80%,#163d32 0%,transparent 35%),
        #070a0f;
    color:#fff;
    min-height:100vh;
}

button,input{
    font:inherit;
}

button{
    cursor:pointer;
}

#login{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:430px;
    background:rgba(18,23,32,.82);
    border:1px solid rgba(255,255,255,.1);
    border-radius:28px;
    padding:35px;
    box-shadow:0 30px 100px rgba(0,0,0,.45);
    backdrop-filter:blur(25px);
}

.logo{
    font-size:34px;
    font-weight:900;
    letter-spacing:-1px;
    margin-bottom:8px;
}

.logo span{
    color:#66e3a1;
}

.subtitle{
    color:#8d98a8;
    margin-bottom:30px;
}

.login-box input{
    width:100%;
    background:#0b0f16;
    border:1px solid #29313d;
    color:white;
    padding:15px;
    border-radius:14px;
    margin-bottom:12px;
    outline:none;
}

.login-box input:focus{
    border-color:#66e3a1;
}

.btn{
    border:0;
    border-radius:14px;
    padding:14px 18px;
    background:#66e3a1;
    color:#07100b;
    font-weight:800;
    transition:.2s;
}

.btn:hover{
    transform:translateY(-2px);
    filter:brightness(1.08);
}

.btn.secondary{
    background:#171e29;
    color:#fff;
}

.btn.google{
    width:100%;
    margin-top:10px;
    background:#fff;
    color:#111;
}

.error{
    color:#ff7272;
    margin-top:12px;
    font-size:14px;
}

#app{
    display:none;
    min-height:100vh;
}

header{
    height:74px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    border-bottom:1px solid rgba(255,255,255,.08);
    background:rgba(7,10,15,.72);
    backdrop-filter:blur(20px);
    position:sticky;
    top:0;
    z-index:20;
}

.header-logo{
    font-size:23px;
    font-weight:900;
}

.header-logo span{
    color:#66e3a1;
}

.user-area{
    display:flex;
    align-items:center;
    gap:12px;
}

.avatar{
    width:38px;
    height:38px;
    border-radius:50%;
    background:#66e3a1;
    color:#07100b;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
}

.layout{
    max-width:1450px;
    margin:auto;
    padding:30px;
    display:grid;
    grid-template-columns:270px 1fr;
    gap:25px;
}

.sidebar{
    background:rgba(15,20,29,.78);
    border:1px solid rgba(255,255,255,.08);
    border-radius:24px;
    padding:18px;
    height:max-content;
    position:sticky;
    top:100px;
}

.side-title{
    color:#7e8998;
    font-size:12px;
    text-transform:uppercase;
    font-weight:800;
    margin:10px 10px 12px;
}

.routine-nav{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.routine-nav button{
    text-align:left;
    background:transparent;
    color:#c9d0d9;
    border:0;
    padding:13px;
    border-radius:12px;
}

.routine-nav button:hover,
.routine-nav button.active{
    background:#18231f;
    color:#66e3a1;
}

.add-routine{
    width:100%;
    margin-top:15px;
}

.main{
    min-width:0;
}

.welcome{
    margin-bottom:25px;
}

.welcome h1{
    font-size:34px;
    margin-bottom:6px;
}

.welcome p{
    color:#8792a1;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:25px;
}

.stat{
    background:rgba(15,20,29,.78);
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;
    padding:20px;
}

.stat-label{
    color:#8792a1;
    font-size:13px;
}

.stat-number{
    font-size:32px;
    font-weight:900;
    margin-top:7px;
}

.content{
    background:rgba(15,20,29,.78);
    border:1px solid rgba(255,255,255,.08);
    border-radius:24px;
    padding:25px;
}

.content-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
}

.content-head h2{
    font-size:25px;
}

.actions{
    display:flex;
    gap:8px;
}

.task-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.task{
    display:flex;
    align-items:center;
    gap:15px;
    background:#0c1118;
    border:1px solid #202834;
    border-radius:16px;
    padding:15px;
    transition:.2s;
}

.task.done{
    border-color:#315943;
    background:#0d1712;
}

.check{
    width:27px;
    height:27px;
    min-width:27px;
    border-radius:9px;
    border:2px solid #4b5664;
    background:transparent;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#06100a;
    font-weight:900;
}

.task.done .check{
    background:#66e3a1;
    border-color:#66e3a1;
}

.task-info{
    flex:1;
}

.task-name{
    font-weight:800;
}

.task.done .task-name{
    color:#718079;
    text-decoration:line-through;
}

.task-note{
    color:#697482;
    font-size:13px;
    margin-top:3px;
}

.task-delete{
    border:0;
    background:transparent;
    color:#697482;
    font-size:18px;
}

.task-delete:hover{
    color:#ff6d6d;
}

.start-box{
    margin-top:20px;
    background:linear-gradient(135deg,#12241c,#101b18);
    border:1px solid #274c3a;
    border-radius:20px;
    padding:20px;
}

.start-box h3{
    margin-bottom:6px;
}

.start-box p{
    color:#87978e;
    font-size:14px;
    margin-bottom:15px;
}

.progress{
    height:8px;
    background:#20282d;
    border-radius:99px;
    overflow:hidden;
    margin:15px 0;
}

.progress-bar{
    height:100%;
    background:#66e3a1;
    width:0%;
    transition:.3s;
}

.history{
    margin-top:25px;
}

.history-item{
    padding:14px 0;
    border-bottom:1px solid #202631;
    display:flex;
    justify-content:space-between;
    gap:20px;
}

.history-item:last-child{
    border-bottom:0;
}

.history-date{
    color:#687483;
    font-size:13px;
}

.success{
    color:#66e3a1;
}

.fail{
    color:#ff7373;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    backdrop-filter:blur(10px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
}

.modal-box{
    width:100%;
    max-width:500px;
    background:#111720;
    border:1px solid #29313d;
    border-radius:25px;
    padding:25px;
}

.modal-box h2{
    margin-bottom:20px;
}

.modal-box input,
.modal-box textarea{
    width:100%;
    background:#080c12;
    color:white;
    border:1px solid #29313d;
    padding:14px;
    border-radius:13px;
    margin-bottom:12px;
    outline:none;
}

.modal-box textarea{
    min-height:90px;
    resize:vertical;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
}

.empty{
    text-align:center;
    padding:45px 20px;
    color:#687483;
}

.running{
    position:fixed;
    right:25px;
    bottom:25px;
    width:330px;
    background:#111820;
    border:1px solid #315943;
    border-radius:20px;
    padding:20px;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
    display:none;
    z-index:50;
}

.running-title{
    color:#66e3a1;
    font-weight:900;
    font-size:13px;
    text-transform:uppercase;
    margin-bottom:7px;
}

.running-task{
    font-size:21px;
    font-weight:900;
    margin-bottom:15px;
}

@media(max-width:850px){
    .layout{
        grid-template-columns:1fr;
        padding:15px;
    }

    .sidebar{
        position:static;
    }

    .routine-nav{
        display:grid;
        grid-template-columns:repeat(2,1fr);
    }

    .dashboard{
        grid-template-columns:1fr;
    }

    header{
        padding:0 15px;
    }

    .content-head{
        align-items:flex-start;
        flex-direction:column;
    }

    .running{
        left:15px;
        right:15px;
        width:auto;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->

<section id="login">

    <div class="login-box">

        <div class="logo">Routine<span>OS</span></div>

        <div class="subtitle">
            Deine Routinen. Dein Tag. Alles im Überblick.
        </div>

        <input id="email" type="email" placeholder="E-Mail">

        <input id="password" type="password" placeholder="Passwort">

        <button class="btn" style="width:100%" onclick="login()">
            Anmelden
        </button>

        <button class="btn secondary" style="width:100%;margin-top:8px" onclick="register()">
            Konto erstellen
        </button>

        <button class="btn google" onclick="googleLogin()">
            Mit Google anmelden
        </button>

        <div id="loginError" class="error"></div>

    </div>

</section>


<!-- APP -->

<div id="app">

<header>

    <div class="header-logo">
        Routine<span>OS</span>
    </div>

    <div class="user-area">

        <div id="userName"></div>

        <div class="avatar" id="avatar">
            E
        </div>

        <button class="btn secondary" onclick="logout()">
            Logout
        </button>

    </div>

</header>


<div class="layout">

    <aside class="sidebar">

        <div class="side-title">
            Meine Routinen
        </div>

        <div id="routineNav" class="routine-nav"></div>

        <button class="btn add-routine" onclick="openRoutineModal()">
            + Routine erstellen
        </button>

        <div class="side-title" style="margin-top:25px">
            Übersicht
        </div>

        <button class="btn secondary" style="width:100%" onclick="showOverview()">
            Verlauf & Statistik
        </button>

    </aside>


    <main class="main">

        <div class="welcome">

            <h1 id="welcomeText">
                Guten Abend
            </h1>

            <p>
                Starte eine Routine und arbeite deine Schritte nacheinander ab.
            </p>

        </div>


        <div class="dashboard">

            <div class="stat">
                <div class="stat-label">
                    Routinen
                </div>

                <div class="stat-number" id="routineCount">
                    0
                </div>
            </div>


            <div class="stat">
                <div class="stat-label">
                    Aufgaben heute
                </div>

                <div class="stat-number" id="todayTasks">
                    0
                </div>
            </div>


            <div class="stat">
                <div class="stat-label">
                    Erledigt heute
                </div>

                <div class="stat-number" id="todayDone">
                    0
                </div>
            </div>

        </div>


        <section class="content" id="routineContent">

            <div class="empty">
                Lade Routinen...
            </div>

        </section>


        <section class="content history" id="overviewContent" style="display:none">

            <div class="content-head">

                <h2>
                    Verlauf
                </h2>

                <button class="btn secondary" onclick="showRoutine()">
                    Zurück
                </button>

            </div>

            <div id="historyList"></div>

        </section>

    </main>

</div>

</div>


<!-- ROUTINE MODAL -->

<div class="modal" id="routineModal">

    <div class="modal-box">

        <h2>Neue Routine</h2>

        <input id="routineName" placeholder="z.B. Morgen Routine">

        <input id="routineIcon" placeholder="Symbol, z.B. ☀️">

        <div class="modal-actions">

            <button class="btn secondary" onclick="closeRoutineModal()">
                Abbrechen
            </button>

            <button class="btn" onclick="createRoutine()">
                Erstellen
            </button>

        </div>

    </div>

</div>


<!-- TASK MODAL -->

<div class="modal" id="taskModal">

    <div class="modal-box">

        <h2>Neuer Schritt</h2>

        <input id="taskName" placeholder="z.B. Zähne putzen">

        <textarea id="taskNote" placeholder="Optionale Beschreibung"></textarea>

        <div class="modal-actions">

            <button class="btn secondary" onclick="closeTaskModal()">
                Abbrechen
            </button>

            <button class="btn" onclick="createTask()">
                Speichern
            </button>

        </div>

    </div>

</div>


<!-- RUNNING ROUTINE -->

<div class="running" id="running">

    <div class="running-title">
        Routine läuft
    </div>

    <div class="running-task" id="runningTask">
        ...
    </div>

    <div class="progress">
        <div class="progress-bar" id="runningProgress"></div>
    </div>

    <button class="btn" style="width:100%" onclick="finishRunningTask()">
        ✓ Erledigt
    </button>

    <button class="btn secondary" style="width:100%;margin-top:8px" onclick="stopRoutine()">
        Routine beenden
    </button>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    setDoc,
    doc,
    getDoc,
    getDocs,
    deleteDoc,
    updateDoc,
    query,
    where,
    orderBy,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";


// ======================================================
// FIREBASE
// ======================================================

const firebaseConfig = {
  apiKey: "AIzaSyCA7-h9vNIefSoJQP-u0VNwNNDMo089qtw",
  authDomain: "plan-your-day-ca406.firebaseapp.com",
  projectId: "plan-your-day-ca406",
  storageBucket: "plan-your-day-ca406.firebasestorage.app",
  messagingSenderId: "1012230051586",
  appId: "1:1012230051586:web:5bb04912987d5c9ba8541b"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const provider = new GoogleAuthProvider();


// ======================================================
// STATE
// ======================================================

let currentUser = null;

let routines = [];

let selectedRoutine = null;

let runningTasks = [];

let runningIndex = 0;


// ======================================================
// LOGIN
// ======================================================

window.login = async function(){

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

    }catch(error){

        document.getElementById("loginError").textContent =
            error.message;

    }

};


window.register = async function(){

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    try{

        await createUserWithEmailAndPassword(
            auth,
            email,
            password
        );

    }catch(error){

        document.getElementById("loginError").textContent =
            error.message;

    }

};


window.googleLogin = async function(){

    try{

        await signInWithPopup(
            auth,
            provider
        );

    }catch(error){

        document.getElementById("loginError").textContent =
            error.message;

    }

};


window.logout = async function(){

    await signOut(auth);

};


// ======================================================
// AUTH STATE
// ======================================================

onAuthStateChanged(auth, async user => {

    if(user){

        currentUser = user;

        document.getElementById("login").style.display = "none";

        document.getElementById("app").style.display = "block";

        const name =
            user.displayName ||
            user.email.split("@")[0];

        document.getElementById("userName").textContent =
            name;

        document.getElementById("avatar").textContent =
            name.charAt(0).toUpperCase();

        await loadRoutines();

    }else{

        currentUser = null;

        document.getElementById("login").style.display = "flex";

        document.getElementById("app").style.display = "none";

    }

});


// ======================================================
// ROUTINES LADEN
// ======================================================

async function loadRoutines(){

    routines = [];

    const q = query(
        collection(db,"users",currentUser.uid,"routines"),
        orderBy("createdAt","asc")
    );

    const snapshot = await getDocs(q);

    snapshot.forEach(item => {

        routines.push({
            id:item.id,
            ...item.data()
        });

    });

    document.getElementById("routineCount").textContent =
        routines.length;

    renderRoutineNav();

    if(routines.length){

        selectedRoutine = routines[0];

        await showRoutine();

    }else{

        document.getElementById("routineContent").innerHTML = `
            <div class="empty">
                <h2>Noch keine Routinen</h2>
                <p style="margin-top:8px">
                    Erstelle deine erste Routine.
                </p>
            </div>
        `;

    }

}


// ======================================================
// NAV
// ======================================================

function renderRoutineNav(){

    const nav =
        document.getElementById("routineNav");

    nav.innerHTML = "";

    routines.forEach(routine => {

        const button =
            document.createElement("button");

        button.className =
            selectedRoutine &&
            selectedRoutine.id === routine.id
                ? "active"
                : "";

        button.innerHTML =
            `${routine.icon || "◉"} ${routine.name}`;

        button.onclick = async () => {

            selectedRoutine = routine;

            renderRoutineNav();

            await showRoutine();

        };

        nav.appendChild(button);

    });

}


// ======================================================
// ROUTINE ANZEIGEN
// ======================================================

window.showRoutine = async function(){

    document.getElementById("routineContent").style.display =
        "block";

    document.getElementById("overviewContent").style.display =
        "none";

    if(!selectedRoutine) return;

    const tasks =
        await loadTasks(selectedRoutine.id);

    let completed = 0;

    tasks.forEach(t => {

        if(t.doneToday) completed++;

    });

    document.getElementById("todayTasks").textContent =
        tasks.length;

    document.getElementById("todayDone").textContent =
        completed;


    const content =
        document.getElementById("routineContent");

    content.innerHTML = `

        <div class="content-head">

            <div>

                <h2>
                    ${escapeHtml(selectedRoutine.icon || "◉")}
                    ${escapeHtml(selectedRoutine.name)}
                </h2>

                <p style="color:#697483;margin-top:5px">
                    ${tasks.length} Schritte
                </p>

            </div>

            <div class="actions">

                <button class="btn secondary"
                    onclick="openTaskModal()">
                    + Schritt
                </button>

                <button class="btn"
                    onclick="startRoutine()">
                    ▶ Starten
                </button>

            </div>

        </div>


        <div class="task-list" id="taskList">

        </div>


        <div class="start-box">

            <h3>
                Kurzbefehle-Modus
            </h3>

            <p>
                Starte die Routine. RoutineOS liest dir
                jeden Schritt vor und wartet darauf,
                dass du ihn erledigst.
            </p>

            <button class="btn"
                onclick="startRoutine()">
                Routine starten
            </button>

        </div>

    `;


    const taskList =
        document.getElementById("taskList");


    if(!tasks.length){

        taskList.innerHTML = `
            <div class="empty">
                Noch keine Schritte vorhanden.
            </div>
        `;

    }


    tasks.forEach(task => {

        const el =
            document.createElement("div");

        el.className =
            "task " +
            (task.doneToday ? "done" : "");

        el.innerHTML = `

            <button class="check"
                onclick="toggleTask('${task.id}',${!task.doneToday})">

                ${task.doneToday ? "✓" : ""}

            </button>

            <div class="task-info">

                <div class="task-name">
                    ${escapeHtml(task.name)}
                </div>

                ${
                    task.note
                    ?
                    `<div class="task-note">
                        ${escapeHtml(task.note)}
                    </div>`
                    :
                    ""
                }

            </div>

            <button class="task-delete"
                onclick="deleteTask('${task.id}')">
                ×
            </button>

        `;

        taskList.appendChild(el);

    });

};


// ======================================================
// TASKS
// ======================================================

async function loadTasks(routineId){

    const q = query(
        collection(
            db,
            "users",
            currentUser.uid,
            "routines",
            routineId,
            "tasks"
        ),
        orderBy("createdAt","asc")
    );

    const snapshot =
        await getDocs(q);

    const tasks = [];

    const today =
        new Date().toISOString().slice(0,10);


    snapshot.forEach(item => {

        const data = item.data();

        tasks.push({

            id:item.id,

            ...data,

            doneToday:
                data.lastCompletedDate === today

        });

    });

    return tasks;

}


// ======================================================
// TASK ERSTELLEN
// ======================================================

window.openTaskModal = function(){

    document.getElementById("taskName").value = "";

    document.getElementById("taskNote").value = "";

    document.getElementById("taskModal").style.display =
        "flex";

};


window.closeTaskModal = function(){

    document.getElementById("taskModal").style.display =
        "none";

};


window.createTask = async function(){

    const name =
        document.getElementById("taskName")
        .value
        .trim();

    const note =
        document.getElementById("taskNote")
        .value
        .trim();

    if(!name) return;


    await addDoc(
        collection(
            db,
            "users",
            currentUser.uid,
            "routines",
            selectedRoutine.id,
            "tasks"
        ),
        {
            name,
            note,
            createdAt:serverTimestamp(),
            lastCompletedDate:null
        }
    );


    closeTaskModal();

    await showRoutine();

};


// ======================================================
// TASK ABHAKEN
// ======================================================

window.toggleTask = async function(
    taskId,
    state
){

    const today =
        new Date().toISOString().slice(0,10);


    const taskRef =
        doc(
            db,
            "users",
            currentUser.uid,
            "routines",
            selectedRoutine.id,
            "tasks",
            taskId
        );


    await updateDoc(taskRef,{

        lastCompletedDate:
            state ? today : null

    });


    await showRoutine();

};


// ======================================================
// TASK LÖSCHEN
// ======================================================

window.deleteTask = async function(taskId){

    if(!confirm("Schritt wirklich löschen?"))
        return;


    await deleteDoc(
        doc(
            db,
            "users",
            currentUser.uid,
            "routines",
            selectedRoutine.id,
            "tasks",
            taskId
        )
    );


    await showRoutine();

};


// ======================================================
// ROUTINE ERSTELLEN
// ======================================================

window.openRoutineModal = function(){

    document.getElementById("routineName").value = "";

    document.getElementById("routineIcon").value = "";

    document.getElementById("routineModal").style.display =
        "flex";

};


window.closeRoutineModal = function(){

    document.getElementById("routineModal").style.display =
        "none";

};


window.createRoutine = async function(){

    const name =
        document.getElementById("routineName")
        .value
        .trim();

    const icon =
        document.getElementById("routineIcon")
        .value
        .trim();


    if(!name) return;


    const ref =
        await addDoc(
            collection(
                db,
                "users",
                currentUser.uid,
                "routines"
            ),
            {
                name,
                icon:icon || "◉",
                createdAt:serverTimestamp()
            }
        );


    closeRoutineModal();

    await loadRoutines();

    selectedRoutine =
        routines.find(r => r.id === ref.id) ||
        routines[routines.length-1];

    renderRoutineNav();

    await showRoutine();

};


// ======================================================
// ROUTINE STARTEN
// ======================================================

window.startRoutine = async function(){

    if(!selectedRoutine)
        return;


    runningTasks =
        await loadTasks(selectedRoutine.id);


    if(!runningTasks.length){

        alert("Diese Routine hat noch keine Schritte.");

        return;

    }


    runningIndex = 0;

    document.getElementById("running").style.display =
        "block";


    speakCurrentTask();

};


// ======================================================
// VORLESEN
// ======================================================

function speakCurrentTask(){

    if(runningIndex >= runningTasks.length){

        finishWholeRoutine();

        return;

    }


    const task =
        runningTasks[runningIndex];


    document.getElementById("runningTask").textContent =
        task.name;


    const progress =
        (runningIndex / runningTasks.length) * 100;


    document.getElementById("runningProgress").style.width =
        progress + "%";


    if("speechSynthesis" in window){

        speechSynthesis.cancel();


        const text =
            `Nächster Schritt: ${task.name}. ` +
            `Wenn du fertig bist, drücke erledigt.`;


        const utterance =
            new SpeechSynthesisUtterance(text);


        utterance.lang = "de-DE";

        utterance.rate = 0.92;

        utterance.pitch = 1;


        speechSynthesis.speak(
            utterance
        );

    }

}


// ======================================================
// RUNNING TASK ERLEDIGT
// ======================================================

window.finishRunningTask = async function(){

    const task =
        runningTasks[runningIndex];


    if(!task)
        return;


    await toggleTask(
        task.id,
        true
    );


    runningIndex++;

    speakCurrentTask();

};


// ======================================================
// ROUTINE STOPPEN
// ======================================================

window.stopRoutine = function(){

    speechSynthesis.cancel();

    document.getElementById("running").style.display =
        "none";

};


// ======================================================
// ROUTINE FERTIG
// ======================================================

async function finishWholeRoutine(){

    speechSynthesis.cancel();


    document.getElementById("runningTask").textContent =
        "Routine geschafft ✓";


    document.getElementById("runningProgress").style.width =
        "100%";


    speak(
        `${selectedRoutine.name} ist abgeschlossen. Sehr gut.`
    );


    await addDoc(
        collection(
            db,
            "users",
            currentUser.uid,
            "history"
        ),
        {
            routineId:selectedRoutine.id,
            routineName:selectedRoutine.name,
            completed:true,
            date:new Date().toISOString().slice(0,10),
            timestamp:serverTimestamp()
        }
    );


    setTimeout(()=>{

        document.getElementById("running").style.display =
            "none";

    },2500);


    await showRoutine();

}


// ======================================================
// SPRACHE
// ======================================================

function speak(text){

    if(!("speechSynthesis" in window))
        return;

    speechSynthesis.cancel();

    const voice =
        new SpeechSynthesisUtterance(text);

    voice.lang = "de-DE";

    voice.rate = .92;

    speechSynthesis.speak(voice);

}


// ======================================================
// ÜBERSICHT
// ======================================================

window.showOverview = async function(){

    document.getElementById("routineContent").style.display =
        "none";

    document.getElementById("overviewContent").style.display =
        "block";


    const history =
        document.getElementById("historyList");


    history.innerHTML =
        `<div class="empty">Lade Verlauf...</div>`;


    const q = query(
        collection(
            db,
            "users",
            currentUser.uid,
            "history"
        ),
        orderBy("timestamp","desc")
    );


    const snapshot =
        await getDocs(q);


    history.innerHTML = "";


    if(snapshot.empty){

        history.innerHTML = `
            <div class="empty">
                Noch kein Verlauf vorhanden.
            </div>
        `;

        return;

    }


    snapshot.forEach(item => {

        const data =
            item.data();


        const el =
            document.createElement("div");


        el.className =
            "history-item";


        el.innerHTML = `

            <div>

                <strong>
                    ${escapeHtml(data.routineName)}
                </strong>

                <div class="history-date">
                    ${data.date || ""}
                </div>

            </div>

            <div class="success">
                ✓ Abgeschlossen
            </div>

        `;


        history.appendChild(el);

    });

};


// ======================================================
// HILFSFUNKTION
// ======================================================

function escapeHtml(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


// ======================================================
// BEGRÜSSUNG
// ======================================================

function updateGreeting(){

    const hour =
        new Date().getHours();

    let greeting =
        "Guten Tag";


    if(hour < 12)
        greeting = "Guten Morgen";

    else if(hour >= 18)
        greeting = "Guten Abend";


    document.getElementById("welcomeText")
        .textContent =
        greeting;

}


updateGreeting();

</script>
